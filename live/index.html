<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>강의 라이브 · Second Brain Lab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

    :root {
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --teal: #0d9488;
      --accent: #0ea5e9;
      --r: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif;
      color: var(--text); background: var(--bg); min-height: 100vh;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #0d9488 0%, #0ea5e9 100%);
      padding: 28px 0 0;
    }
    .hero-inner {
      max-width: 900px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hero-title { font-size: 22px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
    .hero-subtitle { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 3px; }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
      border-radius: 20px; padding: 6px 14px; color: #fff; font-size: 13px; font-weight: 700;
    }
    .hero-right { display: flex; align-items: center; gap: 10px; }
    .pw-form { display: flex; gap: 6px; align-items: center; }
    .pw-form input {
      padding: 6px 12px; border: 1px solid rgba(255,255,255,.4); border-radius: 10px;
      font-family: inherit; font-size: 13px; outline: none; width: 130px;
      background: rgba(255,255,255,.15); color: #fff; transition: 0.2s;
    }
    .pw-form input::placeholder { color: rgba(255,255,255,.6); }
    .pw-form input:focus { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.7); }
    .editor-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.4);
      border-radius: 20px; padding: 6px 14px; color: #fff; font-size: 13px; font-weight: 700;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #f87171;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* TABS */
    .tabs-bar {
      max-width: 900px; margin: 20px auto 0; padding: 0 24px;
      display: flex; gap: 0;
    }
    .tab {
      padding: 11px 28px; cursor: pointer; border: none;
      background: rgba(255,255,255,.15); color: rgba(255,255,255,.75);
      font-weight: 700; font-size: 14px; transition: 0.2s;
      border-radius: 12px 12px 0 0; font-family: inherit;
    }
    .tab:hover { background: rgba(255,255,255,.25); color: #fff; }
    .tab.active { background: var(--bg); color: var(--teal); }

    /* WRAP */
    .wrap { max-width: 900px; margin: 0 auto; padding: 28px 24px; }

    /* ── 강의노트 ── */
    .note-toolbar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .note-toolbar h2 { font-size: 16px; font-weight: 900; color: var(--text); }
    .btn {
      border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer;
      font-weight: 700; font-size: 13px; transition: 0.2s; font-family: inherit;
    }
    .btn.primary { background: var(--teal); color: #fff; }
    .btn.primary:hover { background: #0b7a72; }
    .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    .btn.ghost { background: rgba(255,255,255,.15); color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.3); }
    .btn.ghost:hover { background: rgba(255,255,255,.25); }

    .note-input-area {
      background: #fff; border: 2px solid var(--teal); border-radius: var(--r);
      padding: 16px; margin-bottom: 20px;
      box-shadow: 0 0 0 4px rgba(13,148,136,.08);
    }
    .note-period-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
    }
    .note-period-input {
      width: 90px; padding: 6px 10px; border: 1.5px solid var(--line);
      border-radius: 8px; font-family: inherit; font-size: 13px; outline: none;
    }
    .note-period-input:focus { border-color: var(--teal); }
    .note-textarea {
      width: 100%; min-height: 120px; resize: vertical;
      border: 1.5px solid var(--line); border-radius: 10px;
      padding: 12px 14px; font-family: inherit; font-size: 15px; line-height: 1.8;
      outline: none; background: #f8fafc;
    }
    .note-textarea:focus { border-color: var(--teal); background: #fff; }
    .note-save-row { display: flex; justify-content: flex-end; margin-top: 10px; }

    .note-blocks { display: flex; flex-direction: column; gap: 12px; }
    .note-block {
      background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 16px 20px; box-shadow: var(--shadow);
    }
    .note-block-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .note-block-period {
      font-size: 11px; font-weight: 900; letter-spacing: 0.08em;
      color: #fff; background: var(--teal); padding: 2px 10px; border-radius: 20px;
    }
    .note-block-time { font-size: 11px; color: var(--muted); }
    .note-block-del {
      background: #fee2e2; color: #991b1b; border: none;
      padding: 3px 9px; border-radius: 7px; font-size: 11px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .note-block-del:hover { background: #fecaca; }
    .note-block-content { font-size: 15px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
    .note-empty {
      text-align: center; padding: 48px 0; color: var(--muted);
      font-size: 14px; font-style: italic;
    }

    /* ── Q&A ── */
    .qa-input-box {
      background: #fff; border-radius: var(--r); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 20px;
      border: 1.5px solid var(--line);
    }
    .qa-input-box h3 { font-size: 14px; font-weight: 900; color: var(--teal); margin-bottom: 12px; }
    .qa-name-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .qa-name-row input, .qa-text-row textarea {
      border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px;
      font-family: inherit; font-size: 14px; outline: none; transition: 0.2s;
      background: #f8fafc; width: 100%;
    }
    .qa-name-row input { width: 160px; flex-shrink: 0; }
    .qa-name-row input:focus, .qa-text-row textarea:focus {
      border-color: var(--teal); background: #fff;
    }
    .qa-text-row { display: flex; gap: 8px; align-items: flex-end; }
    .qa-text-row textarea { resize: none; min-height: 60px; flex: 1; }
    .qa-list { display: flex; flex-direction: column; gap: 12px; }
    .qa-item {
      background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 16px 20px; box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .qa-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
    .qa-text { font-size: 15px; line-height: 1.7; color: var(--text); }
    .qa-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .qa-reply {
      margin-top: 10px; padding: 10px 14px;
      background: #f0fdf9; border-left: 3px solid var(--teal); border-radius: 0 8px 8px 0;
      font-size: 13px; line-height: 1.6; color: var(--text);
    }
    .qa-reply-label { font-size: 11px; font-weight: 900; color: var(--teal); margin-bottom: 4px; }
    .qa-reply-input-row { display: flex; gap: 8px; margin-top: 10px; }
    .qa-reply-input-row input {
      flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px;
      font-family: inherit; font-size: 13px; outline: none; background: #f8fafc; transition: 0.2s;
    }
    .qa-reply-input-row input:focus { border-color: var(--teal); background: #fff; }

    /* ── 자료 ── */
    .file-list-grid { display: flex; flex-direction: column; gap: 10px; }
    .file-item {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 14px 18px; box-shadow: var(--shadow);
    }
    .file-item .f-icon { font-size: 26px; flex-shrink: 0; }
    .file-item .f-info { flex: 1; min-width: 0; }
    .file-item .f-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .f-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .file-item .f-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .file-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

    /* ── 실습 ── */
    .padlet-wrap { border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }

    /* ── 설문 ── */
    .survey-box {
      background: #fff; border: 1.5px solid var(--line); border-radius: var(--r);
      padding: 24px 28px; margin-bottom: 20px; box-shadow: var(--shadow);
    }
    .survey-box h3 { font-size: 15px; font-weight: 900; margin-bottom: 16px; color: var(--text); }
    .survey-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .survey-option {
      display: flex; align-items: center; gap: 8px;
      background: #f8fafc; border: 1.5px solid var(--line); border-radius: 10px;
      padding: 9px 16px; cursor: pointer; transition: 0.2s; user-select: none;
      font-size: 14px; font-weight: 600;
    }
    .survey-option:hover { border-color: var(--teal); background: #f0fdf9; }
    .survey-option input[type=checkbox] { accent-color: var(--teal); width: 16px; height: 16px; }
    .survey-option.selected { border-color: var(--teal); background: #f0fdf9; color: var(--teal); }
    .survey-submit-row { margin-top: 20px; display: flex; justify-content: flex-end; }
    .survey-done {
      text-align: center; padding: 40px 20px; color: var(--muted);
      font-size: 15px; font-weight: 700;
    }
    /* 차트 */
    .chart-wrap { display: flex; flex-direction: column; gap: 24px; }
    .chart-section h4 { font-size: 13px; font-weight: 900; color: var(--teal); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .chart-label { font-size: 13px; font-weight: 700; width: 70px; flex-shrink: 0; }
    .chart-bar-bg { flex: 1; background: #f1f5f9; border-radius: 8px; height: 28px; overflow: hidden; }
    .chart-bar-fill { height: 100%; background: linear-gradient(90deg, #0d9488, #0ea5e9); border-radius: 8px; transition: width 0.6s ease; display: flex; align-items: center; padding-left: 10px; min-width: 0; }
    .chart-count { font-size: 12px; font-weight: 900; color: #fff; white-space: nowrap; }
    .chart-pct { font-size: 12px; color: var(--muted); font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; }
    .chart-total { font-size: 12px; color: var(--muted); margin-top: 6px; }

    @media (max-width: 640px) {
      .hero-subtitle { display: none; }
      .tab { padding: 10px 12px; font-size: 12px; }
      .qa-name-row { flex-direction: column; }
      .qa-name-row input { width: 100%; }
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-title">🎤 강의 라이브</div>
      <div class="hero-subtitle">Second Brain Lab · 실시간 강의 공간</div>
    </div>
    <div class="hero-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <div class="pw-form" id="pwForm">
        <input type="password" id="pwInput" placeholder="강사 비밀번호" />
        <button class="btn ghost sm" id="pwBtn">입장</button>
      </div>
      <div class="editor-badge" id="editorBadge" style="display:none;">✏️ 강사 모드 <button id="cancelEditBtn" style="margin-left:8px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;cursor:pointer;">나가기</button></div>
    </div>
  </div>
  <div class="tabs-bar">
    <button class="tab active" data-tab="note">📝 강의노트</button>
    <button class="tab" data-tab="qa">💬 Q&A</button>
    <button class="tab" data-tab="practice">🖼 실습</button>
    <button class="tab" data-tab="survey">📊 설문</button>
    <button class="tab" data-tab="files">📎 자료</button>
  </div>
</div>

<div class="wrap">

  <!-- 강의노트 탭 -->
  <div id="tab-note">
    <div class="note-toolbar">
      <h2>강의노트</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn sm" id="downloadNoteBtn" style="background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;">⬇ 다운받기</button>
        <button class="btn sm" id="deleteAllNoteBtn" style="display:none;background:#fee2e2;color:#991b1b;border:none;">🗑 전체 삭제</button>
      </div>
    </div>
    <!-- 편집자 입력 영역 -->
    <div id="noteEditorWrap" style="display:none;">
      <div class="note-input-area">
        <div class="note-period-row">
          <input type="text" id="notePeriodInput" class="note-period-input" placeholder="예: 1교시" maxlength="10" />
          <span style="font-size:13px;color:var(--muted);">교시 라벨 (선택)</span>
        </div>
        <textarea id="noteTextarea" class="note-textarea" placeholder="강의 내용을 입력하세요. 링크, 핵심 키워드, 참고자료 등을 자유롭게..."></textarea>
        <div class="note-save-row">
          <button class="btn primary sm" id="saveNoteBtn">저장 · 추가</button>
        </div>
      </div>
    </div>
    <!-- 블록 목록 (수강생 + 편집자 공통) -->
    <div class="note-blocks" id="noteBlockList">
      <div class="note-empty">강의노트가 여기에 실시간으로 표시됩니다.</div>
    </div>
  </div>

  <!-- Q&A 탭 -->
  <div id="tab-qa" style="display:none;">
    <div id="qaDeleteBar" style="display:none;margin-bottom:12px;">
      <div style="text-align:right;">
        <button class="btn sm" id="qaDeleteBtn" style="background:#fee2e2;color:#991b1b;border:none;">🗑 Q&A 전체 삭제</button>
      </div>
    </div>
    <div class="qa-input-box">
      <h3>💬 질문하기</h3>
      <div class="qa-name-row">
        <input type="text" id="qaName" placeholder="이름 (선택, 익명 가능)" maxlength="20" />
        <div style="flex:1;display:flex;gap:8px;align-items:flex-end;">
          <textarea id="qaText" placeholder="질문이나 코멘트를 입력하세요..." rows="2" style="flex:1;resize:none;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px;outline:none;background:#f8fafc;"></textarea>
          <button class="btn primary" id="qaSubmitBtn">올리기</button>
        </div>
      </div>
    </div>
    <div class="qa-list" id="qaList">
      <div class="qa-empty">아직 질문이 없습니다. 첫 번째로 질문해보세요!</div>
    </div>
  </div>

  <!-- 설문 탭 -->
  <div id="tab-survey" style="display:none;">

    <!-- 수강생용 설문 폼 -->
    <div id="surveyForm">
      <div class="survey-box">
        <h3>Q1. 어떤 AI를 주로 사용중인가요? <span style="font-weight:400;color:var(--muted);font-size:13px;">(복수 선택 가능)</span></h3>
        <div class="survey-options" id="q1options">
          <label class="survey-option"><input type="checkbox" value="제미나이" /> 제미나이</label>
          <label class="survey-option"><input type="checkbox" value="GPT" /> GPT</label>
          <label class="survey-option"><input type="checkbox" value="클로드" /> 클로드</label>
          <label class="survey-option"><input type="checkbox" value="기타" /> 기타</label>
        </div>
      </div>
      <div class="survey-box">
        <h3>Q2. 유료로 이용하고 있는 AI는 어떤건가요? <span style="font-weight:400;color:var(--muted);font-size:13px;">(복수 선택 가능)</span></h3>
        <div class="survey-options" id="q2options">
          <label class="survey-option"><input type="checkbox" value="제미나이" /> 제미나이</label>
          <label class="survey-option"><input type="checkbox" value="GPT" /> GPT</label>
          <label class="survey-option"><input type="checkbox" value="클로드" /> 클로드</label>
          <label class="survey-option"><input type="checkbox" value="기타" /> 기타</label>
        </div>
      </div>
      <div class="survey-box">
        <h3>Q3. 회사에서 사용가능한 AI는 어떤건가요? <span style="font-weight:400;color:var(--muted);font-size:13px;">(복수 선택 가능)</span></h3>
        <div class="survey-options" id="q3options">
          <label class="survey-option"><input type="checkbox" value="제미나이" /> 제미나이</label>
          <label class="survey-option"><input type="checkbox" value="GPT" /> GPT</label>
          <label class="survey-option"><input type="checkbox" value="클로드" /> 클로드</label>
          <label class="survey-option"><input type="checkbox" value="없음" /> 없음</label>
          <label class="survey-option"><input type="checkbox" value="기타" id="q3EtcCheck" /> 기타</label>
        </div>
        <input type="text" id="q3EtcText" placeholder="기타 AI 이름 입력" maxlength="30"
          style="display:none;margin-top:10px;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit;outline:none;" />
      </div>
      <div class="survey-submit-row">
        <button class="btn primary" id="surveySubmitBtn">제출하기</button>
      </div>
    </div>

    <!-- 제출 완료 메시지 -->
    <div id="surveyDone" class="survey-done" style="display:none;">
      ✅ 응답이 제출되었습니다. 감사합니다!
    </div>

    <!-- 강사용 차트 (강사 모드에서만) -->
    <div id="surveyChart" style="display:none;margin-top:24px;">
      <div style="text-align:right;margin-bottom:12px;">
        <button class="btn sm" id="surveyDeleteBtn" style="background:#fee2e2;color:#991b1b;border:none;">🗑 설문 전체 삭제</button>
      </div>
      <div class="survey-box">
        <div class="chart-wrap" id="chartWrap"></div>
        <div class="chart-total" id="chartTotal"></div>
      </div>
    </div>

  </div>

  <!-- 실습 탭 -->
  <div id="tab-practice" style="display:none;">
    <div class="padlet-wrap">
      <div class="padlet-embed" style="border:1px solid rgba(0,0,0,0.1);border-radius:2px;box-sizing:border-box;overflow:hidden;position:relative;width:100%;background:#F4F4F4">
        <p style="padding:0;margin:0">
          <iframe src="https://padlet.com/embed/j8v7cbflc97uocbr" frameborder="0" allow="camera;microphone;geolocation;display-capture;clipboard-write" style="width:100%;height:608px;display:block;padding:0;margin:0"></iframe>
        </p>
      </div>
    </div>
  </div>

  <!-- 자료 탭 -->
  <div id="tab-files" style="display:none;">
    <div id="fileUploadWrap" style="display:none;margin-bottom:20px;">
      <div class="note-input-area" style="display:flex;flex-direction:column;gap:10px;">
        <div style="font-size:14px;font-weight:700;color:var(--text);">📎 자료 링크 추가</div>
        <input type="text" id="fileLinkName" placeholder="파일 이름 (예: 1강 강의자료.pdf)"
          style="border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;background:#f8fafc;" />
        <div style="display:flex;gap:8px;">
          <input type="url" id="fileLinkUrl" placeholder="구글 드라이브 공유 링크 붙여넣기"
            style="flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;background:#f8fafc;" />
          <button class="btn primary" id="fileLinkAddBtn">추가</button>
        </div>
      </div>
    </div>
    <div class="file-list-grid" id="fileList">
      <div class="file-empty">📂 업로드된 자료가 없습니다.</div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc, updateDoc, collection,
    addDoc, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAd08tVXgWZ2_dg3jzvhawmH4jtolRmfhY",
    authDomain: "itnews-82b60.firebaseapp.com",
    projectId: "itnews-82b60",
    storageBucket: "itnews-82b60.firebasestorage.app",
    messagingSenderId: "719267588761",
    appId: "1:719267588761:web:3c4607cb799620f9446608"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const LECTURE_ID = "default";
  const PW = "sblab2026";
  let isEditor = false;

  // ── TABS ──
  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      ["note","qa","practice","survey","files"].forEach(id => {
        document.getElementById("tab-" + id).style.display = t.dataset.tab === id ? "" : "none";
      });
    });
  });

  // ── 강의노트 블록 구독 ──
  const noteBlocksRef = collection(db, "live_notes", LECTURE_ID, "blocks");
  const noteBlocksQuery = query(noteBlocksRef, orderBy("createdAt", "desc"));

  function renderNoteBlocks(snap) {
    const list = document.getElementById("noteBlockList");
    if (!snap || snap.empty) {
      list.innerHTML = '<div class="note-empty">강의노트가 여기에 실시간으로 표시됩니다.</div>';
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const b = d.data();
      const time = b.createdAt?.toDate
        ? b.createdAt.toDate().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
        : "";
      const delBtn = isEditor
        ? `<button class="note-block-del" data-id="${d.id}">삭제</button>`
        : "";
      const periodBadge = b.period
        ? `<span class="note-block-period">${esc(b.period)}</span>`
        : "";
      return `<div class="note-block" data-id="${d.id}">
        <div class="note-block-header">
          <div style="display:flex;align-items:center;gap:8px;">
            ${periodBadge}
            <span class="note-block-time">${time}</span>
          </div>
          ${delBtn}
        </div>
        <div class="note-block-content">${linkify(b.content)}</div>
      </div>`;
    }).join("");
  }

  let latestBlockSnap = null;
  onSnapshot(noteBlocksQuery, snap => {
    latestBlockSnap = snap;
    renderNoteBlocks(snap);
  });

  // ── 비밀번호 / 강사 모드 ──
  function enterEditorMode() {
    isEditor = true;
    document.getElementById("pwForm").style.display = "none";
    document.getElementById("editorBadge").style.display = "";
    document.getElementById("qaDeleteBar").style.display = "";
    document.getElementById("noteEditorWrap").style.display = "";
    document.getElementById("surveyChart").style.display = "";
    document.getElementById("deleteAllNoteBtn").style.display = "";
    document.getElementById("fileUploadWrap").style.display = "";
    renderQAList(latestQASnap);
    renderNoteBlocks(latestBlockSnap);
    renderFileList(latestFileSnap);
  }

  document.getElementById("pwBtn").addEventListener("click", () => {
    const pw = document.getElementById("pwInput").value;
    if (pw === PW) {
      enterEditorMode();
    } else {
      alert("비밀번호가 맞지 않습니다.");
      document.getElementById("pwInput").value = "";
    }
  });
  document.getElementById("pwInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("pwBtn").click();
  });

  document.getElementById("cancelEditBtn").addEventListener("click", () => {
    isEditor = false;
    document.getElementById("pwForm").style.display = "";
    document.getElementById("editorBadge").style.display = "none";
    document.getElementById("qaDeleteBar").style.display = "none";
    document.getElementById("pwInput").value = "";
    document.getElementById("noteEditorWrap").style.display = "none";
    document.getElementById("fileUploadWrap").style.display = "none";
    renderNoteBlocks(latestBlockSnap);
    renderFileList(latestFileSnap);
  });

  document.getElementById("downloadNoteBtn").addEventListener("click", () => {
    if (!latestBlockSnap || latestBlockSnap.empty) {
      alert("다운받을 강의노트가 없습니다.");
      return;
    }
    const lines = latestBlockSnap.docs.map(d => {
      const b = d.data();
      const time = b.createdAt?.toDate
        ? b.createdAt.toDate().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
        : "";
      const header = [b.period, time].filter(Boolean).join(" · ");
      return (header ? `[${header}]\n` : "") + b.content;
    });
    const text = lines.join("\n\n---\n\n");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `강의노트_${LECTURE_ID}_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("saveNoteBtn").addEventListener("click", async () => {
    const content = document.getElementById("noteTextarea").value.trim();
    if (!content) return;
    const period = document.getElementById("notePeriodInput").value.trim();
    const btn = document.getElementById("saveNoteBtn");
    btn.disabled = true;
    btn.textContent = "저장 중...";
    try {
      await addDoc(noteBlocksRef, { content, period: period || "", createdAt: serverTimestamp() });
      document.getElementById("noteTextarea").value = "";
      btn.textContent = "저장됨 ✓";
      setTimeout(() => btn.textContent = "저장 · 추가", 1500);
    } catch(e) {
      alert("저장 실패: " + e.message);
      btn.textContent = "저장 · 추가";
    }
    btn.disabled = false;
  });

  // 블록 삭제 (편집자만)
  document.getElementById("noteBlockList").addEventListener("click", async e => {
    const btn = e.target.closest(".note-block-del");
    if (!btn || !isEditor) return;
    if (!confirm("이 노트를 삭제하시겠습니까?")) return;
    const { deleteDoc: delDoc } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
    await delDoc(doc(db, "live_notes", LECTURE_ID, "blocks", btn.dataset.id));
  });

  // ── Q&A 실시간 구독 ──
  const qaRef = collection(db, "live_qa", LECTURE_ID, "questions");
  const qaQuery = query(qaRef, orderBy("createdAt", "desc"));
  let latestQASnap = null;

  function renderQAList(snap) {
    const list = document.getElementById("qaList");
    if (!snap || snap.empty) {
      list.innerHTML = `<div class="qa-empty">아직 질문이 없습니다. 첫 번째로 질문해보세요!</div>`;
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const q = d.data();
      const name = q.name || "익명";
      const time = q.createdAt?.toDate
        ? q.createdAt.toDate().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })
        : "";
      const replyHtml = q.reply
        ? `<div class="qa-reply"><div class="qa-reply-label">💬 강사 답변</div>${esc(q.reply)}</div>`
        : "";
      const replyInput = isEditor
        ? `<div class="qa-reply-input-row">
            <input type="text" class="reply-input" data-id="${d.id}" placeholder="답변 입력 후 Enter" value="${esc(q.reply || '')}" />
            <button class="btn primary sm reply-btn" data-id="${d.id}">저장</button>
           </div>`
        : "";
      return `<div class="qa-item" data-id="${d.id}">
        <div class="qa-meta">${esc(name)} · ${time}</div>
        <div class="qa-text">${esc(q.text)}</div>
        ${replyHtml}
        ${replyInput}
      </div>`;
    }).join("");

  }

  // event delegation — survives re-renders
  document.getElementById("qaList").addEventListener("click", e => {
    const btn = e.target.closest(".reply-btn");
    if (btn && isEditor) saveReply(btn.dataset.id, btn);
  });
  document.getElementById("qaList").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("reply-input") && isEditor) {
      e.preventDefault();
      const docId = e.target.dataset.id;
      const btn = document.querySelector(`.reply-btn[data-id="${docId}"]`);
      if (btn) saveReply(docId, btn);
    }
  });

  onSnapshot(qaQuery, snap => {
    latestQASnap = snap;
    renderQAList(snap);
  });

  async function saveReply(docId, btn) {
    const input = document.querySelector(`.reply-input[data-id="${docId}"]`);
    if (!input) return;
    const reply = input.value.trim();
    btn.disabled = true;
    btn.textContent = "저장 중...";
    try {
      await updateDoc(doc(db, "live_qa", LECTURE_ID, "questions", docId), { reply });
      btn.textContent = "저장됨 ✓";
      btn.style.background = "#16a34a";
      // onSnapshot will re-render the list — no need to reset button manually
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "저장";
      btn.style.background = "";
      alert("답변 저장 실패: " + e.message + "\n\nFirebase 콘솔에서 Firestore 규칙을 확인해주세요.\nlive_qa 하위 컬렉션 write 권한이 필요합니다.");
    }
  }

  document.getElementById("qaSubmitBtn").addEventListener("click", submitQA);
  document.getElementById("qaText").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitQA(); }
  });

  // ── 강의노트 전체 삭제 ──
  document.getElementById("deleteAllNoteBtn").addEventListener("click", async () => {
    if (!isEditor) return;
    if (!confirm("강의노트 전체를 삭제하시겠습니까?")) return;
    const { getDocs, deleteDoc: delDoc } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
    const allDocs = await getDocs(collection(db, "live_notes", LECTURE_ID, "blocks"));
    await Promise.all(allDocs.docs.map(d => delDoc(d.ref)));
  });

  // ── Q&A 전체 삭제 ──
  document.getElementById("qaDeleteBtn").addEventListener("click", async () => {
    if (!confirm("Q&A 전체를 삭제하시겠습니까?")) return;
    const { getDocs, deleteDoc: delDoc } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
    const allDocs = await getDocs(collection(db, "live_qa", LECTURE_ID, "questions"));
    await Promise.all(allDocs.docs.map(d => delDoc(d.ref)));
  });

  async function submitQA() {
    const text = document.getElementById("qaText").value.trim();
    if (!text) return;
    const name = document.getElementById("qaName").value.trim();
    await addDoc(collection(db, "live_qa", LECTURE_ID, "questions"), {
      name: name || "",
      text,
      createdAt: serverTimestamp()
    });
    document.getElementById("qaText").value = "";
  }

  // ── 설문 ──
  const SURVEY_OPTIONS = ["제미나이", "GPT", "클로드", "기타"];

  // 체크박스 선택 스타일
  document.querySelectorAll(".survey-option input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      cb.closest(".survey-option").classList.toggle("selected", cb.checked);
    });
  });

  // Q3 기타 텍스트 입력창 토글
  document.getElementById("q3EtcCheck").addEventListener("change", function() {
    document.getElementById("q3EtcText").style.display = this.checked ? "" : "none";
  });

  // 이미 제출했으면 폼 숨기기
  if (localStorage.getItem("survey_submitted_" + LECTURE_ID)) {
    document.getElementById("surveyForm").style.display = "none";
    document.getElementById("surveyDone").style.display = "";
  }

  // 설문 전체 삭제
  document.getElementById("surveyDeleteBtn").addEventListener("click", async () => {
    if (!confirm("설문 응답 전체를 삭제하시겠습니까?")) return;
    const { getDocs, deleteDoc: delDoc } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
    const allDocs = await getDocs(collection(db, "live_survey", LECTURE_ID, "responses"));
    await Promise.all(allDocs.docs.map(d => delDoc(d.ref)));
    localStorage.removeItem("survey_submitted_" + LECTURE_ID);
    document.getElementById("surveyForm").style.display = "";
    document.getElementById("surveyDone").style.display = "none";
    document.querySelectorAll(".survey-option input[type=checkbox]").forEach(cb => {
      cb.checked = false;
      cb.closest(".survey-option").classList.remove("selected");
    });
    document.getElementById("q3EtcText").value = "";
    document.getElementById("q3EtcText").style.display = "none";
  });

  // 제출
  document.getElementById("surveySubmitBtn").addEventListener("click", async () => {
    const q1 = [...document.querySelectorAll("#q1options input:checked")].map(x => x.value);
    const q2 = [...document.querySelectorAll("#q2options input:checked")].map(x => x.value);
    const q3raw = [...document.querySelectorAll("#q3options input:checked")].map(x => x.value);
    const q3etcText = document.getElementById("q3EtcText").value.trim();
    const q3 = q3raw.map(v => (v === "기타" && q3etcText) ? `기타(${q3etcText})` : v);
    if (!q1.length && !q2.length && !q3.length) { alert("최소 하나 이상 선택해주세요."); return; }
    await addDoc(collection(db, "live_survey", LECTURE_ID, "responses"), {
      q1, q2, q3, createdAt: serverTimestamp()
    });
    localStorage.setItem("survey_submitted_" + LECTURE_ID, "1");
    document.getElementById("surveyForm").style.display = "none";
    document.getElementById("surveyDone").style.display = "";
  });

  // 실시간 집계 (강사 모드용)
  const surveyRef = collection(db, "live_survey", LECTURE_ID, "responses");
  onSnapshot(surveyRef, snap => {
    const total = snap.size;
    const count = { q1: {}, q2: {}, q3: {} };
    SURVEY_OPTIONS.forEach(o => { count.q1[o] = 0; count.q2[o] = 0; });
    const Q3_FIXED = ["제미나이", "GPT", "클로드", "없음"];
    Q3_FIXED.forEach(o => { count.q3[o] = 0; });
    snap.docs.forEach(d => {
      const r = d.data();
      (r.q1 || []).forEach(v => { if (count.q1[v] !== undefined) count.q1[v]++; });
      (r.q2 || []).forEach(v => { if (count.q2[v] !== undefined) count.q2[v]++; });
      (r.q3 || []).forEach(v => { count.q3[v] = (count.q3[v] || 0) + 1; });
    });

    const renderChart = (title, data, opts) => `
      <div class="chart-section">
        <h4>${title}</h4>
        ${opts.map(opt => {
          const n = data[opt] || 0;
          const pct = total ? Math.round(n / total * 100) : 0;
          return `<div class="chart-bar-row">
            <div class="chart-label">${opt}</div>
            <div class="chart-bar-bg">
              <div class="chart-bar-fill" style="width:${pct}%">
                ${n > 0 ? `<span class="chart-count">${n}명</span>` : ""}
              </div>
            </div>
            <div class="chart-pct">${pct}%</div>
          </div>`;
        }).join("")}
      </div>`;

    const q3AllKeys = [...new Set([...Q3_FIXED, ...Object.keys(count.q3)])];
    document.getElementById("chartWrap").innerHTML =
      renderChart("Q1. 주로 사용하는 AI", count.q1, SURVEY_OPTIONS) +
      renderChart("Q2. 유료 이용 AI", count.q2, SURVEY_OPTIONS) +
      renderChart("Q3. 회사에서 사용가능한 AI", count.q3, q3AllKeys);
    document.getElementById("chartTotal").textContent = `총 응답 ${total}명`;
  });

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function linkify(s) {
    return esc(s).replace(
      /(https?:\/\/[^\s<>"]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#2563eb;word-break:break-all;">$1</a>'
    );
  }

  // ── 파일 자료 (구글 드라이브 링크 방식) ──
  function fileIcon(name) {
    const ext = (name.split(".").pop() || "").toLowerCase();
    const map = { pdf:"📄", pptx:"📊", ppt:"📊", xlsx:"📈", xls:"📈", docx:"📝", doc:"📝",
                  hwp:"📋", zip:"🗜", png:"🖼", jpg:"🖼", jpeg:"🖼", gif:"🖼",
                  mp4:"🎬", mov:"🎬", mp3:"🎵", key:"📊" };
    return map[ext] || "📁";
  }

  let latestFileSnap = null;
  const filesRef = collection(db, "live_files", LECTURE_ID, "items");
  const filesQuery = query(filesRef, orderBy("createdAt", "desc"));

  function renderFileList(snap) {
    const list = document.getElementById("fileList");
    if (!snap || snap.empty) {
      list.innerHTML = '<div class="file-empty">📂 공유된 자료가 없습니다.</div>';
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const f = d.data();
      const delBtn = isEditor
        ? `<button class="btn sm file-del-btn" data-id="${d.id}"
             style="background:#fee2e2;color:#991b1b;border:none;flex-shrink:0;">삭제</button>`
        : "";
      return `<div class="file-item">
        <div class="f-icon">${fileIcon(f.name)}</div>
        <div class="f-info">
          <div class="f-name">${esc(f.name)}</div>
          <div class="f-meta">${f.addedAt || ""}</div>
        </div>
        <div class="f-actions">
          <a href="${f.url}" target="_blank" rel="noopener noreferrer">
            <button class="btn primary sm">🔗 열기</button>
          </a>
          ${delBtn}
        </div>
      </div>`;
    }).join("");
  }

  onSnapshot(filesQuery, snap => {
    latestFileSnap = snap;
    renderFileList(snap);
  });

  // 링크 추가 (강사 모드)
  document.getElementById("fileLinkAddBtn").addEventListener("click", async () => {
    if (!isEditor) return;
    const name = document.getElementById("fileLinkName").value.trim();
    const url = document.getElementById("fileLinkUrl").value.trim();
    if (!name || !url) { alert("파일 이름과 링크를 모두 입력하세요."); return; }
    const btn = document.getElementById("fileLinkAddBtn");
    btn.disabled = true;
    btn.textContent = "추가 중...";
    const now = new Date().toLocaleString("ko-KR", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    try {
      await addDoc(filesRef, { name, url, addedAt: now, createdAt: serverTimestamp() });
      document.getElementById("fileLinkName").value = "";
      document.getElementById("fileLinkUrl").value = "";
      btn.textContent = "추가됨 ✓";
      setTimeout(() => btn.textContent = "추가", 1500);
    } catch(e) {
      alert("추가 실패: " + e.message);
      btn.textContent = "추가";
    }
    btn.disabled = false;
  });

  // 링크 삭제 (강사 모드)
  document.getElementById("fileList").addEventListener("click", async e => {
    const btn = e.target.closest(".file-del-btn");
    if (!btn || !isEditor) return;
    if (!confirm("이 자료를 삭제하시겠습니까?")) return;
    const { deleteDoc: delDoc } = await import("https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js");
    await delDoc(doc(db, "live_files", LECTURE_ID, "items", btn.dataset.id));
  });
</script>
</body>
</html>
